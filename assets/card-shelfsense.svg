<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="ShelfSense project">
  <title>ShelfSense — event-driven IoT inventory system on AWS</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0d8"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#39d0d8" stop-opacity="0.16"/><stop offset="1" stop-color="#39d0d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.7">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.16"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="249" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="16" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="16" fill="url(#glowA)"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="16" fill="url(#glowB)"/>
  <text x="40" y="52" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#39d0d8" letter-spacing="1.5">FEATURED · IoT + CLOUD</text>
  <text x="40" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3">ShelfSense</text>
  <text x="40" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">Event-driven inventory system for supermarkets:</text>
  <text x="40" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">predicts stock-outs, auto-orders, scales on AWS.</text>
  <g transform="translate(40,178)"><rect width="76" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="38.0" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">Node.js</text></g>
  <g transform="translate(124,178)"><rect width="53" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="26.5" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">MQTT</text></g>
  <g transform="translate(185,178)"><rect width="76" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="38.0" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">MongoDB</text></g>
  <g transform="translate(269,178)"><rect width="76" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="38.0" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">SQS/SNS</text></g>
  <g transform="translate(353,178)"><rect width="76" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="38.0" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">EC2 ASG</text></g>
  <g transform="translate(437,178)"><rect width="68" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="34.0" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">Docker</text></g>
  <g transform="translate(470,46)">
    <rect width="156" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="0" y="18" width="3" height="40" rx="1.5" fill="#39d0d8"/>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">186s→1.6s</text>
    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">p95 latency</text>
    <text x="18" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">under burst load</text>
  </g>
  <g transform="translate(637,46)">
    <rect width="156" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="0" y="18" width="3" height="40" rx="1.5" fill="#a371f7"/>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">−65%</text>
    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">worker compute</text>
    <text x="18" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">instance-minutes</text>
  </g>
  <g transform="translate(804,46)">
    <rect width="156" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="0" y="18" width="3" height="40" rx="1.5" fill="#3fb950"/>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">17,300</text>
    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">events processed,</text>
    <text x="18" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">zero dropped</text>
  </g>
  <text x="960" y="200" text-anchor="end" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#8b949e">view repo →</text>
</svg>
