    <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="37" cy="20" r="5" fill="#febc2e"/><circle cx="54" cy="20" r="5" fill="#28c840"/>
    <text x="74" y="24.5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#8b949e">sensor_stream.ipynb</text>
    <circle class="live" cx="300" cy="20" r="4" fill="#3fb950"/>
