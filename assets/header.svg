    <text x="16" y="205" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#8b949e"><tspan fill="#39d0d8">━</tspan> temp   <tspan fill="#a371f7">━</tspan> load   ρ = 0.82</text>
  </g>
</svg>
