    <g transform="translate(-6,46)">
      <path class="draw2" d="M0,133.2 L12,136.5 L24,134.7 L36,130.4 L48,126.5 L60,123.6 L72,120.2 L84,114.3 L96,106.2 L108,98.7 L120,95.8 L132,99.7 L144,109.5 L156,121.1 L168,130.0 L180,133.8 L192,133.2 L204,131.0 L216,129.2 L228,127.6 L240,124.2 L252,117.4 L264,107.9 L276,99.0 L288,95.1 L300,98.3 L312,107.3 L324,118.1 L336,126.5 L348,130.5 L360,131.2" fill="none" stroke="#a371f7" stroke-width="2" stroke-opacity="0.75" stroke-linejoin="round" transform="translate(30,0) scale(0.84,1)"/>
      <path class="draw" d="M0,92.0 L12,109.3 L24,116.0 L36,111.5 L48,105.0 L60,104.1 L72,106.5 L84,103.1 L96,89.3 L108,71.8 L120,62.5 L132,67.0 L144,79.0 L156,87.6 L168,89.1 L180,89.8 L192,97.8 L204,112.0 L216,122.2 L228,119.1 L240,104.6 L252,22 L264,83.2 L276,83.7 L288,82.4 L300,74.5 L312,65.9 L324,66.9 L336,80.9 L348,99.4 L360,110.6" fill="none" stroke="#39d0d8" stroke-width="2.4" stroke-linejoin="round" transform="translate(30,0) scale(0.84,1)"/>
    </g>
    <g class="pop">
      <circle class="pulse" cx="235.67999999999998" cy="68" r="6" fill="none" stroke="#f85149" stroke-width="2"/>
      <circle cx="235.67999999999998" cy="68" r="2.8" fill="#f85149"/>
      <g transform="translate(129.67999999999998,57)">
        <rect width="92" height="22" rx="6" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.5"/>
        <text x="46" y="15" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f85149">anomaly z=4.1</text>
