<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Tommy Nguyen — Data Science, Analytics, Data Engineering">
  <title>Tommy Nguyen — Data Science · Analytics · Data Engineering</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0d8"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#39d0d8" stop-opacity="0.16"/><stop offset="1" stop-color="#39d0d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.7">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.16"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .draw { stroke-dasharray: 900; animation: draw 2.6s ease-out 0.3s backwards; }
    .draw2 { stroke-dasharray: 900; animation: draw 2.6s ease-out 0.6s backwards; }
    .pop { animation: pop 0.5s ease-out 2.2s backwards; }
    .pulse { animation: pulse 1.8s ease-in-out 2.7s infinite; }
    .live { animation: blink 1.6s ease-in-out infinite; }
    .fade1 { animation: up 0.7s ease-out 0.1s backwards; }
    .fade2 { animation: up 0.7s ease-out 0.35s backwards; }
    .fade3 { animation: up 0.7s ease-out 0.6s backwards; }
    .fade4 { animation: up 0.7s ease-out 0.85s backwards; }
    @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .2; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="url(#glowA)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="url(#glowB)"/>

  <!-- left: identity -->
  <g class="fade1"><text x="52" y="96" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#8b949e">hi, I'm</text></g>
  <g class="fade2"><text x="50" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#e6edf3" letter-spacing="-1">Tommy Nguyen</text></g>
  <g class="fade3"><text x="52" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#accent)">Data Science · Analytics · Data Engineering</text></g>
  <g class="fade4">
    <text x="52" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Honours Computer Science @ Deakin University · Melbourne</text>
    <g transform="translate(52,240)">
      <rect width="232" height="30" rx="15" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.45"/>
      <circle class="live" cx="18" cy="15" r="4.5" fill="#3fb950"/>
      <text x="32" y="20" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#3fb950">open to data internships</text>
    </g>
  </g>

  <!-- right: live chart card -->
  <g transform="translate(610,40)">
