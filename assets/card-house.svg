<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250" role="img" aria-label="House Price Pipeline">
  <title>House Price Pipeline</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0d8"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#39d0d8" stop-opacity="0.16"/><stop offset="1" stop-color="#39d0d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.7">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.16"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="489" height="249" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="489" height="249" rx="16" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="489" height="249" rx="16" fill="url(#glowA)"/>
  <rect x="0.5" y="0.5" width="489" height="249" rx="16" fill="url(#glowB)"/>
  <text x="32" y="48" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#3fb950" letter-spacing="1.5">ML + MLOPS</text>
  <text x="32" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3">House Price Pipeline</text>
  <text x="32" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">Random Forest price model, shipped as a</text>
  <text x="32" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">Streamlit app through a full Jenkins</text>
  <text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">pipeline: test → scan → staging → prod.</text>
  <g><circle cx="352" cy="62" r="9" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/><path d="M348,62 l3,3 l5,-6" fill="none" stroke="#3fb950" stroke-width="1.8"/><line x1="361" y1="62" x2="377" y2="62" stroke="#3fb950" stroke-opacity="0.5"/><circle cx="386" cy="62" r="9" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/><path d="M382,62 l3,3 l5,-6" fill="none" stroke="#3fb950" stroke-width="1.8"/><line x1="395" y1="62" x2="411" y2="62" stroke="#3fb950" stroke-opacity="0.5"/><circle cx="420" cy="62" r="9" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/><path d="M416,62 l3,3 l5,-6" fill="none" stroke="#3fb950" stroke-width="1.8"/><line x1="429" y1="62" x2="445" y2="62" stroke="#3fb950" stroke-opacity="0.5"/><circle cx="454" cy="62" r="9" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/><path d="M450,62 l3,3 l5,-6" fill="none" stroke="#3fb950" stroke-width="1.8"/><text x="403" y="92" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#8b949e">CI/CD passing</text></g>
  <g transform="translate(32,196)"><rect width="115" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="57.5" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">scikit-learn</text></g>
  <g transform="translate(155,196)"><rect width="91" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="45.5" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">Streamlit</text></g>
  <g transform="translate(254,196)"><rect width="68" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="34.0" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">Docker</text></g>
  <g transform="translate(330,196)"><rect width="76" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="38.0" y="17.5" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8b949e">Jenkins</text></g>
</svg>
